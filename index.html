<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Behavior Ranking Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
<script>
  // Apply saved/system theme before paint to avoid a flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem("theme");
    var dark = saved ? saved === "dark"
      : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Team Behavior Ranking Dashboard
      <span class="sub">เปรียบเทียบพฤติกรรมการทำงาน 4 ด้าน ระหว่าง 2 เดือน</span>
    </h1>
    <div class="head-actions">
      <div class="seg" id="skillSeg">
        <button data-v="ALL" class="on">ทุก Skill</button>
        <button data-v="NODE">NODE</button>
        <button data-v="OFC">OFC</button>
      </div>
      <button class="theme-toggle" id="themeToggle" title="สลับธีม Light/Dark" aria-label="สลับธีม"></button>
    </div>
  </header>

  <div class="tabs" id="behTabs"></div>

  <div class="controls">
    <div class="ctl"><label>ระดับ (Level)</label>
      <div class="seg" id="levelSeg">
        <button data-v="region" class="on">ภาค</button>
        <button data-v="prov">จังหวัด</button>
        <button data-v="team">ทีม</button>
      </div>
    </div>
    <div class="ctl"><label>ภาค (Region)</label><select id="fRegion"></select></div>
    <div class="ctl"><label>จังหวัด (Province)</label><select id="fProv"></select></div>
    <div class="ctl"><label>เดือนตั้งต้น (A)</label><select id="mA"></select></div>
    <div class="ctl"><label>เดือนเทียบ (B)</label><select id="mB"></select></div>
    <div class="ctl"><label>WO ขั้นต่ำ (เดือน B)</label><input id="minWO" type="number" value="20" min="0" step="5"></div>
    <div class="ctl" style="flex:1;min-width:160px"><label>ค้นหา (Search)</label><input id="search" type="search" placeholder="ชื่อ / ภาค / จังหวัด…" autocomplete="off"></div>
    <div class="ctl"><label>&nbsp;</label><button class="btn" id="exportBtn">⬇ Export CSV</button></div>
    <div class="ctl"><label>&nbsp;</label><button class="btn" id="clearBtn">↺ ล้างตัวกรอง</button></div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="grid2">
    <div class="panel">
      <h2><span id="rankTitle">อันดับพฤติกรรม</span><span class="hint">คลิกแถวเพื่อดูรายละเอียด</span></h2>
      <div class="crumb" id="crumb"></div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th class="l">#</th><th class="l">ชื่อ</th>
            <th>A (<span class="mA-lbl"></span>)</th>
            <th>B (<span class="mB-lbl"></span>)</th>
            <th>Δ เปลี่ยนแปลง</th><th>WO (B)</th>
          </tr></thead>
          <tbody id="rankBody"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <h2><span id="detailTitle">รายละเอียดหน่วยที่เลือก</span></h2>
      <div id="detail"></div>
      <h2 style="margin-top:6px"><span id="trendTitle">แนวโน้มรายเดือน</span></h2>
      <div class="chartbox"><svg id="chart" width="100%" height="100%"></svg></div>
      <div class="legend" id="legend"></div>
      <div id="miniStats" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
