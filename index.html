<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Behavior Ranking Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
<script>
  // Apply saved/system theme before paint to avoid a flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem("theme");
    var dark = saved ? saved === "dark"
      : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Team Behavior Ranking Dashboard
      <span class="sub">เปรียบเทียบพฤติกรรมการทำงาน 4 ด้าน ระหว่าง 2 เดือน</span>
    </h1>
    <div class="head-actions">
      <button class="theme-toggle" id="themeToggle" title="สลับธีม Light/Dark" aria-label="สลับธีม"></button>
    </div>
  </header>

  <div class="tabs" id="behTabs"></div>

  <div class="controls">
    <div class="cgroup">
      <span class="cgroup-title">Skill</span>
      <div class="cgroup-body">
        <div class="seg" id="skillSeg">
          <button data-v="ALL" class="on">ทุก Skill</button>
          <button data-v="NODE">NODE</button>
          <button data-v="OFC">OFC</button>
        </div>
      </div>
    </div>

    <div class="cgroup">
      <span class="cgroup-title">จัดอันดับราย</span>
      <div class="cgroup-body">
        <div class="seg" id="levelSeg">
          <button data-v="region" class="on">ภาค</button>
          <button data-v="prov">จังหวัด</button>
          <button data-v="team">ทีม</button>
        </div>
        <select id="fRegion" class="drill" aria-label="กรองภาค"></select>
        <select id="fProv" class="drill" aria-label="กรองจังหวัด"></select>
      </div>
    </div>

    <div class="cgroup">
      <span class="cgroup-title">เปรียบเทียบเดือน</span>
      <div class="cgroup-body month-cmp">
        <select id="mA" aria-label="เดือนตั้งต้น"></select>
        <span class="arrow" aria-hidden="true">→</span>
        <select id="mB" aria-label="เดือนเทียบ"></select>
      </div>
    </div>

    <div class="cgroup">
      <span class="cgroup-title">กรองผล</span>
      <div class="cgroup-body">
        <label class="field-inline" title="ตัดหน่วยที่ WO ในเดือน B น้อยกว่าค่านี้">WO&nbsp;≥
          <input id="minWO" type="number" value="20" min="0" step="5"></label>
        <input id="search" type="search" placeholder="🔍 ค้นหา ชื่อ / ภาค / จังหวัด…" autocomplete="off">
      </div>
    </div>

    <div class="cgroup cactions">
      <span class="cgroup-title">&nbsp;</span>
      <div class="cgroup-body">
        <button class="btn" id="exportBtn">⬇ Export CSV</button>
        <button class="btn btn-ghost" id="clearBtn">↺ ล้าง</button>
      </div>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="grid2">
    <div class="panel">
      <h2><span id="rankTitle">อันดับพฤติกรรม</span><span class="hint">คลิกแถวเพื่อดูรายละเอียด</span></h2>
      <div class="crumb" id="crumb"></div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th class="l">#</th><th class="l">ชื่อ</th>
            <th>A (<span class="mA-lbl"></span>)</th>
            <th>B (<span class="mB-lbl"></span>)</th>
            <th>Δ เปลี่ยนแปลง</th><th>WO (B)</th>
          </tr></thead>
          <tbody id="rankBody"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <h2><span id="detailTitle">รายละเอียดหน่วยที่เลือก</span></h2>
      <div id="detail"></div>
      <h2 style="margin-top:6px"><span id="trendTitle">แนวโน้มรายเดือน</span></h2>
      <div class="chartbox"><svg id="chart" width="100%" height="100%"></svg></div>
      <div class="legend" id="legend"></div>
      <div id="miniStats" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
