server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # Assets are small, gzipped and ETag'd — revalidate every load (304 when unchanged)
    # so a redeploy never serves a stale cached app.js.
    add_header Cache-Control "no-cache" always;

    # The data files are large (data/data.json ~5 MB, data/detail/*.json ~3-4 MB each).
    # gzip cuts each transfer to roughly a fifth, so it is essential here.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      application/json application/javascript text/css text/plain image/svg+xml application/xml;

    # Live data API (FastAPI + PostgreSQL). The full /api/... path is forwarded as-is.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;   # Docker embedded DNS — resolve at request time
        set $api_upstream api:8000;                 # via a variable so nginx STARTS even if the api
        proxy_pass http://$api_upstream;            # container is down (then 502 -> frontend uses static)
        client_max_body_size 200M;                  # Excel imports (a month of MATELINE) can be tens of MB
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;     # first /api/data build can take a while on a cold cache
    }

    location / { try_files $uri $uri/ =404; }
}
